<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clément Design — Tableau de bord</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#201D1A;
    --ink-soft:#4A453E;
    --muted:#83796C;
    --paper:#EFEAE0;
    --canvas:#FBF8F2;
    --line:#DAD2C2;
    --thread:#A63328;
    --thread-dark:#7E2419;
    --stitch:#4C6B4F;
    --radius:3px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background-color:var(--paper);
    background-image:
      repeating-linear-gradient(45deg, rgba(32,29,26,0.025) 0px, rgba(32,29,26,0.025) 1px, transparent 1px, transparent 10px),
      repeating-linear-gradient(-45deg, rgba(32,29,26,0.025) 0px, rgba(32,29,26,0.025) 1px, transparent 1px, transparent 10px);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 16px;
  }
  .wrap{max-width:520px;width:100%;text-align:center;}

  .logo{max-width:420px;width:100%;height:auto;margin-bottom:8px;}
  .subtitle{
    font-family:'Fraunces',serif;
    font-size:16px;
    font-weight:500;
    color:var(--ink-soft);
    margin:0 0 44px;
    letter-spacing:0.3px;
  }

  .choices{
    display:flex;
    flex-direction:column;
    gap:18px;
  }
  .choice{
    display:block;
    background:var(--canvas);
    border:1.5px solid var(--line);
    border-radius:var(--radius);
    padding:26px 24px;
    text-decoration:none;
    color:var(--ink);
    transition:border-color 0.15s ease, transform 0.1s ease;
  }
  .choice:hover{
    border-color:var(--thread);
    transform:translateY(-1px);
  }
  .choice .icon{
    font-size:26px;
    margin-bottom:10px;
  }
  .choice .title{
    font-family:'Fraunces',serif;
    font-size:21px;
    font-weight:600;
    margin-bottom:5px;
  }
  .choice .desc{
    font-size:13px;
    color:var(--muted);
  }

  footer{
    margin-top:36px;
    font-size:11.5px;
    color:var(--muted);
    letter-spacing:0.2px;
  }

  .auth-gate{
    position:fixed; inset:0; z-index:1000;
    background-color:var(--paper);
    background-image:
      repeating-linear-gradient(45deg, rgba(32,29,26,0.025) 0px, rgba(32,29,26,0.025) 1px, transparent 1px, transparent 10px),
      repeating-linear-gradient(-45deg, rgba(32,29,26,0.025) 0px, rgba(32,29,26,0.025) 1px, transparent 1px, transparent 10px);
    display:flex; align-items:center; justify-content:center;
    padding:24px;
  }
  .auth-card{
    background:var(--canvas);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:32px 28px;
    max-width:340px; width:100%;
    text-align:center;
  }
  .auth-card .logo{max-width:200px; margin-bottom:20px;}
  .auth-card h2{font-family:'Fraunces',serif; font-size:17px; font-weight:600; margin:0 0 18px; color:var(--ink-soft);}
  .auth-field{margin-bottom:14px; text-align:left;}
  .auth-field label{display:block; font-size:11.5px; font-weight:600; color:var(--ink-soft); margin-bottom:5px;}
  .auth-field input{width:100%; font-size:15px; padding:10px; border:1.5px solid var(--line); border-radius:var(--radius); background:#fff; box-sizing:border-box;}
  .auth-field input:focus{outline:none; border-color:var(--thread);}
  .auth-error{color:var(--thread); font-size:12px; margin-bottom:10px; min-height:15px;}
  .auth-submit{width:100%; background:var(--thread); color:#fff; border:none; border-radius:var(--radius); padding:12px; font-weight:600; font-size:14.5px; cursor:pointer; margin-top:2px;}
  .auth-submit:hover{background:var(--thread-dark);}
  .auth-submit:disabled{background:var(--line); color:var(--muted); cursor:not-allowed;}
  .user-bar{
    display:flex; align-items:center; justify-content:center; gap:8px;
    font-size:11.5px; color:var(--muted); margin-bottom:18px;
  }
  .user-bar button{
    background:none; border:none; color:var(--thread); text-decoration:underline;
    font-size:11.5px; cursor:pointer; padding:0;
  }
</style>
</head>

<script>
const authGate = document.getElementById('authGate');
const mainContent = document.getElementById('mainContent');
const authEmail = document.getElementById('authEmail');
const authPassword = document.getElementById('authPassword');
const authError = document.getElementById('authError');
const authSubmit = document.getElementById('authSubmit');
const userEmailLabel = document.getElementById('userEmailLabel');
const logoutBtn = document.getElementById('logoutBtn');

function showApp(session){
  authGate.style.display = 'none';
  mainContent.style.display = '';
  userEmailLabel.textContent = session.user.email;
}
function showLogin(){
  authGate.style.display = 'flex';
  mainContent.style.display = 'none';
}

supabaseClient.auth.getSession().then(({data:{session}}) => {
  if (session) showApp(session); else showLogin();
});
supabaseClient.auth.onAuthStateChange((event, session) => {
  if (session) showApp(session); else showLogin();
});

async function doLogin(){
  authError.textContent = '';
  authSubmit.disabled = true;
  const { error } = await supabaseClient.auth.signInWithPassword({
    email: authEmail.value.trim(),
    password: authPassword.value
  });
  authSubmit.disabled = false;
  if (error) authError.textContent = "Email ou mot de passe incorrect.";
}
authSubmit.addEventListener('click', doLogin);
authPassword.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
logoutBtn.addEventListener('click', () => supabaseClient.auth.signOut());
</script>
